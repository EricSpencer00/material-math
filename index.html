<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Procedural materials. Made with math, generated in your browser, downloaded as SVG."><title>material math</title><link rel="stylesheet" href="style.css?v=locks1"></head>
<body data-state="idle">
<header class="chrome"><h1>material math</h1><a href="https://github.com/EricSpencer00/material-math" target="_blank" rel="noopener">GitHub ↗</a></header>
<main><img id="art" alt="Generated procedural material" hidden><div id="start"><button id="randomize" class="primary">Randomize</button><button id="customize" aria-expanded="false" aria-controls="settings">don't randomize</button><div id="settings" hidden><div class="setting"><label for="material">Material</label><select id="material"></select><label class="lock"><input id="lock-material" type="checkbox" checked> Lock material</label></div><div class="setting"><span id="colors-label">Colors</span><div class="swatches" role="group" aria-labelledby="colors-label"><input id="shadow-color" type="color" value="#1d2528" aria-label="Shadow color"><input id="mid-color" type="color" value="#64594e" aria-label="Midtone color"><input id="light-color" type="color" value="#e9d2b0" aria-label="Highlight color"></div><label class="lock"><input id="lock-colors" type="checkbox" checked> Lock colors</label></div></div></div><div id="actions" hidden><a id="download" download>Download SVG</a><button id="embed">Embed</button><button id="again">Randomize</button></div><div id="embed-panel" hidden><label for="embed-code">Embed code</label><textarea id="embed-code" readonly rows="3"></textarea><button id="copy">Copy</button><button id="close">Close</button></div><p id="status" role="status" class="sr-only"></p></main>
<footer class="chrome"><a href="https://ericspencer.us/">Eric Spencer ↗</a></footer>
<script type="module" src="src/app.mjs?v=locks1"></script>
</body></html>
